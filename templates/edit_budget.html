{% extends "base.html" %}

{% block title %}
予算編集 | 家計簿アプリ
{% endblock %}

{% block content %}
    <section class="page-header">
        <h1>予算を編集する</h1>
    </section>

    <div class="page-actions link-box">
        <a 
            class="text-link"
            href="{{ url_for('budgets') }}">
            予算一覧へ戻る
        </a>
    </div>

    {% if errors %}
        <div
            id="form-errors"
            class="error-box link-box"
            role="alert">
            <ul>
                {% for error in errors%}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form 
        class="form-card"
        action="#form-errors"
        method="post">

        <div class="form-group">
            <label class="form-label" for="month">年月</label>
            <input 
                class="form-control"
                type="month" name="month" id="month" value="{{ month or '' }}"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="category">カテゴリ</label>
            <input 
                class="form-control"
                type="text" name="category" id="category" value="{{ category or '' }}"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="budget">金額</label>
            <input 
                class="form-control"
                type="number" name="budget" id="budget" value="{{ budget or '' }}" min="1"
            >
        </div>

        <div class="form-actions">
            <button
                class="submit-button"
                type="submit">
                編集する
            </button>
        </div>
    </form>
        
{% endblock %}
